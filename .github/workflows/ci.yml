name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Check formatting
        run: |
          files=$(find . -path ./third_party -prune -o -name '*.go' -print)
          test -z "$(gofmt -l $files)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
